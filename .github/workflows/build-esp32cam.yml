name: Build ESP32-CAM firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-esp32cam.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Assemble sketch
        run: |
          SRC='firmware/esp32_cam_lpr_v10_ha_device_rc2'
          mkdir -p ci_sketch build
          cat "$SRC/esp32_cam_lpr_v10_ha_device_rc2.ino" > ci_sketch/ci_sketch.ino
          tail -n +2 "$SRC/part_02.ino" >> ci_sketch/ci_sketch.ino
          cat "$SRC/part_03.ino" >> ci_sketch/ci_sketch.ino
          cat "$SRC/part_04.ino" >> ci_sketch/ci_sketch.ino
          cat "$SRC/part_05.ino" >> ci_sketch/ci_sketch.ino
          cat "$SRC/part_06.ino" >> ci_sketch/ci_sketch.ino

      - name: Apply v10 RC2 web fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci_sketch/ci_sketch.ino')
          s = p.read_text()
          marker = '''  page.replace(\n    "%PHOTOS%",'''
          insert = '''  page.replace("%INFONAME%", htmlEscape(settings.cameraName));\n  page.replace("%FWVERSION%", String(FIRMWARE_VERSION));\n  page.replace("%FWBUILD%", String(FIRMWARE_BUILD));\n  page.replace("%PROTOVER%", String(LPR_PROTOCOL_VERSION));\n  page.replace("%CAMERAID%", htmlEscape(cameraUniqueId()));\n  page.replace("%INFOIP%", WiFi.localIP().toString());\n\n'''
          if marker not in s:
              raise SystemExit('Device info insertion point not found')
          s = s.replace(marker, insert + marker, 1)
          old = '''  server.send(ok ? 200 : 500, "text/plain",\n              ok ? "Aggiornamento completato. Riavvio..."\n                 : "Aggiornamento FALLITO");'''
          new = '''  String otaResult;\n  if (ok) {\n    otaResult = "Aggiornamento completato. Riavvio...";\n  } else {\n    otaResult = "Aggiornamento FALLITO - errore ";\n    otaResult += String(Update.getError());\n    otaResult += ": ";\n    otaResult += Update.errorString();\n    Serial.println(otaResult);\n    systemLog("ERROR", otaResult);\n  }\n\n  server.send(ok ? 200 : 500, "text/plain", otaResult);'''
          if old not in s:
              raise SystemExit('OTA completion block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Compile AI Thinker ESP32-CAM
        run: |
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32cam:PartitionScheme=min_spiffs' \
            --output-dir build \
            ci_sketch

      - name: Prepare OTA binary
        run: |
          BIN=$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n 1)
          test -n "$BIN"
          cp "$BIN" build/Lettore-Targhe-ESPcam-v10.0.0-rc2-AI-Thinker.bin
          ls -lh build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lettore-Targhe-ESPcam-v10.0.0-rc2-AI-Thinker
          path: build/Lettore-Targhe-ESPcam-v10.0.0-rc2-AI-Thinker.bin
          if-no-files-found: error
